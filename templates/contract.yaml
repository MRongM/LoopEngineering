loop_id: loop-example-001
contract_version: 1
protocol_version: 0.1.0
objective: Add one verified example behavior
mode: autonomous
repositories:
  - id: target
    # Replace with the resolved absolute Git root before validation.
    path: .
    base_branch: master
    allowed_paths:
      - src/
      - tests/
    depends_on: []
in_scope:
  - Implement the approved behavior
out_of_scope:
  - Deployment
acceptance_criteria:
  - id: AC-1
    description: Focused tests pass
    required_evidence:
      - VAL-1
validation_commands:
  - id: VAL-1
    repository_id: target
    cwd: .
    argv:
      - python
      - -m
      - pytest
      - tests/test_example.py
      - -q
    criterion_ids:
      - AC-1
    timeout_seconds: 600
    requires_network: false
    workspace_policy: isolated
risk_level: low
permissions:
  network: false
  dependency_changes: false
  database_changes: false
  production_access: false
  sensitive_data: false
authorized_operations: []
execution_plan:
  design_decisions:
    - Keep Core tool-independent and persist the approved execution boundary.
  actions:
    - kind: file_write
      repository_id: target
      target: src/
      impact: Changes implementation files in the approved source boundary
      risk: A regression may be introduced
      recovery: Restore affected files or apply a forward fix
      evidence: VAL-1 verifies the acceptance criterion
    - kind: file_write
      repository_id: target
      target: tests/
      impact: Changes tests in the approved test boundary
      risk: A test may encode the wrong behavior
      recovery: Correct the test against the approved contract
      evidence: VAL-1 executes the focused tests
git_policy:
  targets:
    - repository_id: target
      create_worktree: false
      commit: false
      push: false
      create_pr: false
  force_push: false
  history_rewrite: false
  merge: false
  deploy: false
budget:
  max_iterations: 3
  max_minutes: 30
  max_checker_revisions: 0
  max_same_strategy_retries: 1
human_gates:
  - contract_approval
assumptions:
  - The repository uses Python
stop_conditions:
  - done
  - blocked
  - budget_exhausted
