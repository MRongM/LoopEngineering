[project]
name = "loop-engineering"
version = "0.1.0"
description = "Evidence-gated loops for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16,<4",
  "pydantic>=2.12.5,<3",
  "PyYAML>=6.0.3,<7",
]

[project.scripts]
loop-engine = "loop_engineering.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_engineering"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
